[common]
enable-ruleset = true
append-proxy = true
prepend-rules = true
# 固定：所有订阅节点先汇入这个组
proxy-group = 全部节点

[custom]
# ====================== 基础节点池 ======================
[[custom_groups]]
name = 全部节点
type = select

# ====================== 地区分组 ======================
# 香港节点
[[custom_groups]]
name = 🇭🇰 香港节点
type = select
use = ["全部节点"]
filter = 香港|HK|HongKong

# 台湾节点
[[custom_groups]]
name = ******** 台湾节点
type = select
use = ["全部节点"]
filter = 台湾|TW|Taiwan

# 美国节点
[[custom_groups]]
name = 🇺🇸 美国节点
type = select
use = ["全部节点"]
filter = 美国|US|USA|UnitedStates

# 日本节点
[[custom_groups]]
name = 🇯🇵 日本节点
type = select
use = ["全部节点"]
filter = 日本|JP|Japan

# 新加坡节点
[[custom_groups]]
name = 🇸🇬 新加坡节点
type = select
use = ["全部节点"]
filter = 新加坡|SG|Singapore

# 韩国节点
[[custom_groups]]
name = 🇰🇷 韩国节点
type = select
use = ["全部节点"]
filter = 韩国|KR|Korea

# 其他地区节点（不匹配上面关键词的全部丢这里）
[[custom_groups]]
name = 🌐 其他节点
type = select
use = ["全部节点"]
exclude-filter = 香港|HK|Taiwan|TW|美国|US|日本|JP|新加坡|SG|韩国|KR

# ====================== 功能策略组 ======================
# 自动选择（url-test 自动选延迟最低）
[[custom_groups]]
name = ⚡ 自动选择
type = url-test
use = ["全部节点"]
url = http://www.gstatic.com/generate_204
interval = 300
tolerance = 150

# 手动选择
[[custom_groups]]
name = 🖱️ 手动选择
type = select
use = ["全部节点"]
proxies = ["⚡ 自动选择"]

# GLOBAL 总出口组（顶层，给兜底MATCH用）
[[custom_groups]]
name = 🌍 GLOBAL
type = select
proxies = ["🖱️ 手动选择","⚡ 自动选择","🇭🇰 香港节点","******** 台湾节点","🇺🇸 美国节点","🇯🇵 日本节点","🇸🇬 新加坡节点","🇰🇷 韩国节点","🌐 其他节点","DIRECT"]

# ====================== 网站应用分组 ======================
# 谷歌
[[custom_groups]]
name = 🔍 Google谷歌
type = select
proxies = ["🌍 GLOBAL","🇺🇸 美国节点","🇯🇵 日本节点","🇸🇬 新加坡节点"]

# ChatHub
[[custom_groups]]
name = 💬 ChatHub
type = select
proxies = ["🌍 GLOBAL","🇺🇸 美国节点","🇸🇬 新加坡节点"]

# Steam
[[custom_groups]]
name = 🎮 Steam
type = select
proxies = ["🌍 GLOBAL","🇰🇷 韩国节点","🇯🇵 日本节点","🇺🇸 美国节点","DIRECT"]

# Twitter/X
[[custom_groups]]
name = 🐦 Twitter
type = select
proxies = ["🌍 GLOBAL","🇺🇸 美国节点","🇸🇬 新加坡节点"]

# Telegram
[[custom_groups]]
name = ✈️ Telegram
type = select
proxies = ["🌍 GLOBAL","🇸🇬 新加坡节点","🇯🇵 日本节点","🇺🇸 美国节点"]

# ====================== 分流规则 ======================
[[rules]]
rule = RULE-SET,google,🔍 Google谷歌
[[rules]]
rule = RULE-SET,chathub,💬 ChatHub
[[rules]]
rule = RULE-SET,steam,🎮 Steam
[[rules]]
rule = RULE-SET,twitter,🐦 Twitter
[[rules]]
rule = RULE-SET,telegram,✈️ Telegram

# 国内流量直连
[[rules]]
rule = RULE-SET,china,DIRECT
[[rules]]
rule = RULE-SET,geosite-cn,DIRECT

# 兜底全部走GLOBAL
[[rules]]
rule = MATCH,🌍 GLOBAL

# ====================== 远程规则集 ======================
[[rule_set]]
name = china
type = remote
url = https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/china.txt
interval = 86400

[[rule_set]]
name = geosite-cn
type = remote
url = https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/geosite-cn.txt
interval = 86400

[[rule_set]]
name = google
type = remote
url = https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt
interval = 86400

[[rule_set]]
name = chathub
type = remote
url = https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/chathub.txt
interval = 86400

[[rule_set]]
name = steam
type = remote
url = https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/steam.txt
interval = 86400

[[rule_set]]
name = twitter
type = remote
url = https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/twitter.txt
interval = 86400

[[rule_set]]
name = telegram
type = remote
url = https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegram.txt
interval = 86400
